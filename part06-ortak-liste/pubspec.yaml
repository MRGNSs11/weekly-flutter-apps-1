name: ortak_liste
description: "İki telefonda anlık güncellenen ortak alışveriş listesi (Firebase)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Kalam
      fonts:
        - asset: assets/fonts/Kalam-Regular.ttf
        - asset: assets/fonts/Kalam-Bold.ttf
          weight: 700
    - family: ArchivoBlack
      fonts:
        - asset: assets/fonts/ArchivoBlack-Regular.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Italic.ttf
          style: italic
