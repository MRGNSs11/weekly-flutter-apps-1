# Her push'ta, her PR'da ve ayda bir kez çalışır.
# guvenlik-kontrol.ps1'in makinede çalışabilen kısmı + her uygulamanın testleri.
# Dış eylemler commit SHA'sına sabit (etiket taşınsa da kod değişmez).
# Release manifest izin denetimi (betiğin 3. adımı) burada YOK: 7 release
# derlemesi çok yavaş, o adım yerelde `.\guvenlik-kontrol.ps1 -Derle` ile yapılır.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 1 * *" # ayın 1'i — eski paketlerde sonradan çıkan açıklar için
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # bir uygulamanın hatası diğerlerini gizlemesin
      matrix:
        app:
          - part01-aliskanlik-takipcisi
          - part02-tarif-defteri
          - part03-film-arama
          - part04-metin-tarayici
          - part05-su-takipcisi
          - part06-ortak-liste
          - part07-deprem-haritasi
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      # Part 06'nın gerçek firebase_options.dart'ı depoda yok (benim Firebase projeme ait,
      # flutterfire configure üretir). Analiz ve testler için yer tutucu yazılır.
      - name: Placeholder firebase_options.dart
        if: matrix.app == 'part06-ortak-liste'
        run: |
          cat > lib/firebase_options.dart <<'EOF'
          import 'package:firebase_core/firebase_core.dart';

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform =>
                throw UnsupportedError('CI placeholder — run flutterfire configure');
          }
          EOF
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  firestore-rules:
    name: Firestore rules (part06)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: part06-ortak-liste
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0 — Firestore emülatörü Java ister
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix kural-testi
      # demo- ile başlayan proje kimliği gerçek bir Firebase projesine bağlanmaz.
      - run: npx --yes firebase-tools@15.34.0 emulators:exec --only firestore --project demo-ortak-liste "npm --prefix kural-testi test"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tüm geçmiş taransın
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9 — kökteki .gitleaks.toml'u kullanır
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency vulnerabilities (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
      - name: Scan every pubspec.lock
        run: |
          args=""
          for lock in part*/pubspec.lock; do args="$args --lockfile=$lock"; done
          "$(go env GOPATH)/bin/osv-scanner" scan source --verbosity=warn $args
