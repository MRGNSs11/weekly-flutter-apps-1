# Her push'ta, her PR'da ve ayda bir kez çalışır.
# guvenlik-kontrol.ps1'in makinede çalışabilen kısmı + her uygulamanın testleri.
# Release manifest izin denetimi (betiğin 3. adımı) burada YOK: 7 release
# derlemesi çok yavaş, o adım yerelde `.\guvenlik-kontrol.ps1 -Derle` ile yapılır.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 1 * *" # ayın 1'i — eski paketlerde sonradan çıkan açıklar için
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # bir uygulamanın hatası diğerlerini gizlemesin
      matrix:
        app:
          - part01-aliskanlik-takipcisi
          - part02-tarif-defteri
          - part03-film-arama
          - part04-metin-tarayici
          - part05-su-takipcisi
          - part06-ortak-liste
          - part07-deprem-haritasi
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  firestore-rules:
    name: Firestore rules (part06)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: part06-ortak-liste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4 # Firestore emülatörü Java ister
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix kural-testi
      # demo- ile başlayan proje kimliği gerçek bir Firebase projesine bağlanmaz.
      - run: npx --yes firebase-tools emulators:exec --only firestore --project demo-ortak-liste "npm --prefix kural-testi test"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tüm geçmiş taransın
      - uses: gitleaks/gitleaks-action@v2 # kökteki .gitleaks.toml'u kullanır
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency vulnerabilities (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
      - name: Scan every pubspec.lock
        run: |
          args=""
          for lock in part*/pubspec.lock; do args="$args --lockfile=$lock"; done
          "$(go env GOPATH)/bin/osv-scanner" scan source --verbosity=warn $args
